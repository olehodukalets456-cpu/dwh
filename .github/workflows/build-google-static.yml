name: Build self-contained Google landing

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-google-static.yml'
      - 'google/data/**'
      - 'rebuild-google.txt'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild original landing as one HTML file
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import gzip
          import re

          def chunk_number(path: Path) -> int:
              match = re.search(r'(\d+)$', path.stem)
              return int(match.group(1)) if match else 0

          def unpack(pattern: str, output: str) -> None:
              files = sorted(Path('google/data').glob(pattern), key=chunk_number)
              if not files:
                  raise SystemExit(f'No files matched {pattern}')

              parts = []
              for file in files:
                  text = file.read_text(encoding='utf-8').strip()
                  match = re.search(r'push\("([A-Za-z0-9+/=]+)"\)', text)
                  if not match:
                      raise SystemExit(f'Invalid payload: {file}')
                  parts.append(match.group(1))

              html = gzip.decompress(base64.b64decode(''.join(parts)))
              if len(html) < 1000 or b'<html' not in html.lower():
                  raise SystemExit(f'Invalid decoded HTML for {output}')

              Path(output).write_bytes(html)
              print(f'Wrote {output}: {len(html)} bytes from {len(files)} chunks')

          unpack('ua-*.txt', 'google/index.html')

          if list(Path('google/data').glob('terms-*.txt')):
              unpack('terms-*.txt', 'google/terms.html')
          PY

      - name: Commit generated HTML
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add google/index.html
          if test -f google/terms.html; then git add google/terms.html; fi
          if git diff --cached --quiet; then
            echo 'Nothing to commit'
          else
            git commit -m 'Build self-contained Google landing [skip ci]'
            git push origin main
          fi
