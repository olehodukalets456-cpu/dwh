name: Deploy original Google landing

on:
  pull_request:
    paths:
      - 'google-deploy-payload/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Restore original static landing
        shell: bash
        run: |
          if [ ! -d google-deploy-payload ]; then
            echo 'Payload already consumed'
            exit 0
          fi

          cat google-deploy-payload/part-*.txt | base64 --decode > /tmp/google-site.tar.gz
          gzip -t /tmp/google-site.tar.gz

          rm -rf google
          tar -xzf /tmp/google-site.tar.gz -C .
          rm -rf google-deploy-payload

          test -f google/index.html
          test -f google/_next/static/chunks/2f5u3uk0o3gkc.css
          test -f google/landing/hero/bg.png
          test -f google/landing/compatibility/google-meta.png

          if grep -q 'Failed to Decode Data\|__DWH_PARTS__\|DecompressionStream\|atob(' google/index.html; then
            echo 'Old broken loader is still present'
            exit 1
          fi

          echo "Static landing restored: $(wc -c < google/index.html) bytes"

      - name: Commit original files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A google google-deploy-payload .nojekyll
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'Upload original Google landing files'
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
