name: Install Google landing package

on:
  push:
    branches:
      - main
    paths:
      - 'google-ready.zip'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate and install package
        shell: bash
        run: |
          test -f google-ready.zip
          rm -rf /tmp/google-ready
          mkdir -p /tmp/google-ready
          unzip -q google-ready.zip -d /tmp/google-ready

          test -f /tmp/google-ready/google/index.html
          test -f /tmp/google-ready/google/_next/static/chunks/2f5u3uk0o3gkc.css
          test -f /tmp/google-ready/google/landing/hero/bg.png
          test -f /tmp/google-ready/google/landing/compatibility/google-meta.png
          test -f /tmp/google-ready/.nojekyll

          if grep -q 'Failed to Decode Data\|__DWH_PARTS__\|DecompressionStream\|atob(' /tmp/google-ready/google/index.html; then
            echo 'Package contains the old broken loader'
            exit 1
          fi

          rm -rf google
          cp -a /tmp/google-ready/google ./google
          cp /tmp/google-ready/.nojekyll ./.nojekyll
          rm google-ready.zip

          echo "Installed $(find google -type f | wc -l) files"
          echo "Main HTML: $(wc -c < google/index.html) bytes"

      - name: Commit installed landing
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A google google-ready.zip .nojekyll
          git commit -m 'Install original Google landing files'
          git push
