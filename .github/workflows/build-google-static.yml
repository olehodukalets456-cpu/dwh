name: Build Google landing static

on:
  push:
    paths:
      - '.github/workflows/build-google-static.yml'
      - 'google/build-static-trigger.txt'
      - 'google/data/**'
  pull_request:
    paths:
      - 'google/build-static-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}

      - name: Decode original landing
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import gzip
          import re

          root = Path('google/data')
          alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/'

          def extract_parts(prefix: str, count: int) -> list[str]:
              parts = []
              for i in range(1, count + 1):
                  path = root / f'{prefix}-{i}.txt'
                  text = path.read_text(encoding='utf-8-sig')
                  start = text.find('push("')
                  end = text.rfind('")')
                  if start < 0 or end <= start + 6:
                      raise RuntimeError(f'Cannot parse {path}')
                  part = re.sub(r'[^A-Za-z0-9+/=]', '', text[start + 6:end])
                  parts.append(part.replace('=', ''))
              return parts

          def unpack(encoded: str) -> str:
              padded = encoded + '=' * (-len(encoded) % 4)
              raw = base64.b64decode(padded, validate=True)
              html = gzip.decompress(raw).decode('utf-8')
              if len(html) < 1000 or '<html' not in html.lower():
                  raise RuntimeError('Decoded content is not HTML')
              return html

          def decode(prefix: str, count: int) -> str:
              parts = extract_parts(prefix, count)
              joined = ''.join(parts)
              print(prefix, 'part lengths:', [len(p) for p in parts], 'total:', len(joined), 'mod4:', len(joined) % 4)

              try:
                  return unpack(joined)
              except Exception as direct_error:
                  print(prefix, 'direct decode failed:', repr(direct_error))

              boundaries = [0]
              offset = 0
              for part in parts:
                  offset += len(part)
                  boundaries.append(offset)

              # The payload is one Base64 stream split into files. One character was
              # lost while those files were created, so repair it at a split boundary.
              positions = sorted({
                  max(0, min(len(joined), boundary + delta))
                  for boundary in boundaries
                  for delta in range(-4, 5)
              })

              for pos in positions:
                  for ch in alphabet:
                      candidate = joined[:pos] + ch + joined[pos:]
                      try:
                          html = unpack(candidate)
                          print(prefix, 'repaired missing character at', pos, 'with', ch)
                          return html
                      except Exception:
                          pass

              # Also handle one accidental extra character near a split boundary.
              for pos in positions:
                  if pos >= len(joined):
                      continue
                  candidate = joined[:pos] + joined[pos + 1:]
                  try:
                      html = unpack(candidate)
                      print(prefix, 'removed extra character at', pos)
                      return html
                  except Exception:
                      pass

              raise RuntimeError(f'Could not repair {prefix} payload')

          main_html = decode('ua', 9)
          terms_html = decode('terms', 3)

          redirect = "<script>if(new URLSearchParams(location.search).get('terms')==='1'){location.replace('/google/terms.html')}</script>"
          if '<head>' in main_html:
              main_html = main_html.replace('<head>', '<head>' + redirect, 1)
          else:
              main_html = redirect + main_html

          Path('google/index.html').write_text(main_html, encoding='utf-8')
          Path('google/terms.html').write_text(terms_html, encoding='utf-8')

          print('main bytes:', len(main_html.encode('utf-8')))
          print('terms bytes:', len(terms_html.encode('utf-8')))
          PY

      - name: Commit static HTML
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add google/index.html google/terms.html
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'Serve original Google landing as static HTML'
          git push origin HEAD:${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
