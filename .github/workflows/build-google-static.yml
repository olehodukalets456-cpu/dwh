name: Build Google landing as static HTML

on:
  push:
    paths:
      - '.github/workflows/build-google-static.yml'
      - 'google/build-static-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode landing payloads
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import gzip
          import re

          root = Path('google/data')

          def decode(prefix: str, count: int) -> str:
              chunks = []
              for i in range(1, count + 1):
                  path = root / f'{prefix}-{i}.txt'
                  text = path.read_text(encoding='utf-8-sig').strip()
                  match = re.search(r'push\("([A-Za-z0-9+/=\r\n]+)"\)', text)
                  if not match:
                      raise RuntimeError(f'Cannot parse {path}')
                  chunks.append(re.sub(r'\s+', '', match.group(1)))
              encoded = ''.join(chunks)
              raw = base64.b64decode(encoded, validate=True)
              return gzip.decompress(raw).decode('utf-8')

          main_html = decode('ua', 9)
          terms_html = decode('terms', 3)

          # Keep the original page intact; only route the existing ?terms=1 URL
          # to a separately decoded static document.
          redirect = "<script>if(new URLSearchParams(location.search).get('terms')==='1'){location.replace('/google/terms.html')}</script>"
          marker = '<head>'
          if marker in main_html:
              main_html = main_html.replace(marker, marker + redirect, 1)
          else:
              main_html = redirect + main_html

          Path('google/index.html').write_text(main_html, encoding='utf-8')
          Path('google/terms.html').write_text(terms_html, encoding='utf-8')

          print('main bytes:', len(main_html.encode('utf-8')))
          print('terms bytes:', len(terms_html.encode('utf-8')))
          PY

      - name: Commit static files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add google/index.html google/terms.html
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'Serve Google landing as static HTML'
          git push
