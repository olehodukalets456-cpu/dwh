name: Install original Google landing

on:
  push:
    branches: [main]
    paths:
      - 'google-package/ready.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install original files
        shell: bash
        run: |
          set -euo pipefail
          test -f google-package/ready.txt
          cat google-package/part-*.txt | base64 --decode > /tmp/google-ready.zip
          unzip -tq /tmp/google-ready.zip

          rm -rf /tmp/google-ready
          mkdir -p /tmp/google-ready
          unzip -q /tmp/google-ready.zip -d /tmp/google-ready

          test -f /tmp/google-ready/google/index.html
          test -f /tmp/google-ready/google/_next/static/chunks/2f5u3uk0o3gkc.css
          test -f /tmp/google-ready/google/landing/hero/bg.png
          test -f /tmp/google-ready/google/landing/compatibility/google-meta.png
          test -f /tmp/google-ready/.nojekyll

          rm -rf google
          cp -a /tmp/google-ready/google ./google
          cp /tmp/google-ready/.nojekyll ./.nojekyll
          rm -rf google-package

          test "$(find google -type f | wc -l)" -eq 58
          echo "Installed $(find google -type f | wc -l) original files"

      - name: Commit installed files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A google google-package .nojekyll
          git commit -m 'Upload original Google landing files'
          git push
