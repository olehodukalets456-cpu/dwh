name: Install original Google landing

on:
  pull_request:
    branches: [main]
    paths:
      - 'google-deploy-payload/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Restore original package
        shell: bash
        run: |
          test -d google-deploy-payload
          cat google-deploy-payload/part-*.txt | base64 --decode > /tmp/google-ready.zip

          rm -rf /tmp/google-ready
          mkdir -p /tmp/google-ready
          unzip -q /tmp/google-ready.zip -d /tmp/google-ready

          test -f /tmp/google-ready/google/index.html
          test -f /tmp/google-ready/google/_next/static/chunks/2f5u3uk0o3gkc.css
          test -f /tmp/google-ready/google/landing/hero/bg.png
          test -f /tmp/google-ready/google/landing/compatibility/google-meta.png
          test -f /tmp/google-ready/.nojekyll

          if grep -q 'Failed to Decode Data\|__DWH_PARTS__\|DecompressionStream\|Не вдалося завантажити сторінку' /tmp/google-ready/google/index.html; then
            echo 'The package contains a broken loader'
            exit 1
          fi

          rm -rf google
          cp -a /tmp/google-ready/google ./google
          cp /tmp/google-ready/.nojekyll ./.nojekyll
          rm -rf google-deploy-payload

          echo "Installed $(find google -type f | wc -l) original files"
          echo "Main HTML size: $(wc -c < google/index.html) bytes"

      - name: Commit original files to source branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A google google-deploy-payload .nojekyll
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'Install original Google landing files'
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
