name: Install Google landing ZIP

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-google-landing.yml'
      - 'google-ready*.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install ZIP unchanged
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . -maxdepth 1 -type f -name 'google-ready*.zip' | sort | head -n 1)"
          test -n "$ZIP_FILE"
          unzip -tq "$ZIP_FILE"

          rm -rf /tmp/google-ready
          mkdir -p /tmp/google-ready
          unzip -q "$ZIP_FILE" -d /tmp/google-ready

          test -f /tmp/google-ready/google/index.html
          test -f /tmp/google-ready/google/_next/static/chunks/2f5u3uk0o3gkc.css
          test -f /tmp/google-ready/google/landing/hero/bg.png
          test -f /tmp/google-ready/google/landing/compatibility/google-meta.png
          test -f /tmp/google-ready/.nojekyll

          rm -rf google
          cp -a /tmp/google-ready/google ./google
          cp /tmp/google-ready/.nojekyll ./.nojekyll
          rm -f google-ready*.zip

          test "$(find google -type f | wc -l)" -eq 58
          echo "Installed $(find google -type f | wc -l) original files"

      - name: Commit installed files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A google .nojekyll google-ready*.zip || true
          if git diff --cached --quiet; then
            echo 'Nothing to commit'
            exit 0
          fi
          git commit -m 'Upload original Google landing files [skip ci]'
          git push
