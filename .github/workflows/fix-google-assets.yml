name: Fix Google landing asset paths

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-google-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prefix public asset paths with /google
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('google')
          if not root.is_dir():
              raise SystemExit('google directory not found')

          asset_exts = {
              '.png', '.jpg', '.jpeg', '.webp', '.svg', '.gif', '.avif',
              '.ico', '.woff', '.woff2', '.ttf', '.otf', '.mp4', '.webm'
          }
          text_exts = {'.html', '.js', '.css', '.json', '.svg', '.xml', '.txt', '.map'}

          assets = []
          for path in root.rglob('*'):
              if path.is_file() and path.suffix.lower() in asset_exts:
                  rel = path.relative_to(root).as_posix()
                  assets.append(rel)

          # Longest paths first prevents a shorter filename from partially matching a longer one.
          assets.sort(key=len, reverse=True)
          changed_files = 0
          replacements = 0

          for path in root.rglob('*'):
              if not path.is_file() or path.suffix.lower() not in text_exts:
                  continue
              try:
                  original = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue

              updated = original
              for rel in assets:
                  old = '/' + rel
                  new = '/google/' + rel
                  # Do not touch full external URLs or paths already prefixed with /google.
                  pattern = re.compile(r'(?<![A-Za-z0-9_./-])' + re.escape(old))
                  updated, count = pattern.subn(new, updated)
                  replacements += count

              if updated != original:
                  path.write_text(updated, encoding='utf-8')
                  changed_files += 1

          print(f'Patched {replacements} asset references in {changed_files} files')
          if replacements == 0:
              raise SystemExit('No broken asset paths found')
          PY

      - name: Commit fixed site
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add google
          git commit -m 'Fix Google landing image paths'
          git push origin main
