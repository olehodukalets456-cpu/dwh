name: Deploy original Google landing

on:
  push:
    paths:
      - "google-deploy-trigger.txt"
      - ".github/workflows/deploy-google-landing.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch the original landing project
        run: |
          rm -rf /tmp/dwh-source
          git clone https://github.com/dmnd-tech/dwh-hub-shop.git /tmp/dwh-source
          git -C /tmp/dwh-source checkout 6cd4077e8b0b74e8da36243481ecc66f2acd80f2

      - name: Configure a static build for /google
        working-directory: /tmp/dwh-source
        run: |
          rm -f src/proxy.ts
          cat > next.config.ts <<'EOF'
          import type { NextConfig } from "next";
          import createNextIntlPlugin from "next-intl/plugin";

          const nextConfig: NextConfig = {
            output: "export",
            basePath: "/google",
            assetPrefix: "/google",
            trailingSlash: true,
            images: { unoptimized: true },
          };

          const withNextIntl = createNextIntlPlugin("./src/i18n/request.ts");
          export default withNextIntl(nextConfig);
          EOF

      - name: Install and build without changing the design
        working-directory: /tmp/dwh-source
        env:
          NEXT_PUBLIC_SITE_URL: https://domainswithhistory.shop/google
          NEXT_PUBLIC_TELEGRAM_CHANNEL_URL: https://t.me/Domains_shop_support
          NEXT_PUBLIC_SUPPORT_URL: mailto:dwhsupport@gmail.com
        run: |
          npm ci
          npm run build
          cat > out/index.html <<'EOF'
          <!doctype html><html><head><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=/google/ua/"><script>location.replace('/google/ua/')</script></head><body></body></html>
          EOF

      - name: Replace /google with the original exported landing
        run: |
          rm -rf google
          mkdir -p google
          cp -a /tmp/dwh-source/out/. google/
          touch .nojekyll
          rm -f .github/workflows/deploy-google-landing.yml
          rm -f google-deploy-trigger.txt

      - name: Commit all landing files and assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy original Google landing with all assets"
          git push
