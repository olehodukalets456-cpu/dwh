<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#09090b"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>DWH HUB — Domains with History</title><meta name="description" content="Перевірені домени з чистою історією для Google Ads, Meta Ads, media buying та SEO."><style>html,body{height:100%;margin:0;background:#09090b;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.loading{min-height:100%;display:grid;place-items:center}.box{text-align:center;padding:24px}.mark{width:52px;height:52px;margin:auto;border-radius:16px;background:linear-gradient(135deg,#e6ff54,#73f7b7);box-shadow:0 0 36px #bcff5a55;animation:p 1s ease-in-out infinite alternate}.txt{margin-top:16px;opacity:.72;font-size:13px;letter-spacing:.14em;text-transform:uppercase}.error{max-width:680px;color:#f4f4f5}.error small{display:block;margin-top:14px;color:#a1a1aa;word-break:break-word}@keyframes p{to{transform:scale(.92);opacity:.65}}</style></head><body><div class="loading"><div class="box"><div class="mark"></div><div class="txt">DWH HUB</div></div></div><script>(async()=>{try{const q=new URLSearchParams(location.search),terms=q.get('terms')==='1',count=terms?3:9,prefix=terms?'terms':'ua',parts=[];for(let i=1;i<=count;i++){const url=`/google/data/${prefix}-${i}.txt?v=202607291715`;const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw new Error(`Файл ${i} не завантажився: HTTP ${r.status}`);const s=await r.text(),a=s.indexOf('push("'),b=s.lastIndexOf('")');if(a<0||b<a)throw new Error(`Файл ${i} пошкоджений`);parts.push(s.slice(a+6,b))}const z=parts.join(''),raw=atob(z),bytes=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);if(!('DecompressionStream'in window))throw new Error('Браузер не підтримує розпакування gzip');const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip')),html=await new Response(stream).text();if(!html||html.length<1000)throw new Error('Отримана сторінка порожня');document.open();document.write(html);document.close()}catch(e){console.error(e);document.body.innerHTML=`<div class="loading"><div class="box error"><h1>Не вдалося завантажити сторінку</h1><p>Оновіть сторінку.</p><small>${String(e&&e.message||e)}</small></div></div>`}})()</script></body></html>
